name: raut_field
description: "Raut Field Sales — offline-first field sales app for the Raut ERP platform."
publish_to: "none"
version: 1.2.2+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Offline store. The handset is the system of record between check-ins, so
  # this is a local mirror with an outbox, not a cache.
  sqflite: ^2.4.1
  path: ^1.9.0

  # Credentials and the sync watermark
  shared_preferences: ^2.3.3

  # Field capabilities
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  connectivity_plus: ^7.3.1
  # Battery level rides along with every breadcrumb, so the office can tell a
  # dead handset from a rep who has stopped moving.
  battery_plus: ^7.1.2

  # Identity for offline writes — the idempotency key the server dedupes on
  uuid: ^4.5.1

  # State management
  provider: ^6.1.2

  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_maps_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Runs the real sqflite engine on the desktop VM, so the offline store and
  # outbox can be tested without an emulator in the loop.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    # The supplied Raut artwork. Displayed as-is — see lib/widgets/raut_mark.dart.
    - assets/brand/
